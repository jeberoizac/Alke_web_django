{% extends 'base.html' %}
{% load static %}

{% block title %}Lista de Productos{% endblock %}

{% block content %}
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista de Productos</h1>
        <a href="{% url 'agregar_producto' %}" class="btn btn-outline-primary">+ Agregar Producto</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body bg-light">
            <form method="GET" class="row g-3" hx-get="{% url 'lista_producto' %}" hx-target="#contenedor-tabla" hx-swap="outerHTML" hx-trigger="change, keyup delay:500ms from:input[name='q']">
                
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Buscar por Serie/Modelo</label>
                    <input type="text" name="q" class="form-control" placeholder="Escriba para buscar..." value="{{ request.GET.q }}">
                </div>
                
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="">Todos los estados</option>
                        {% for valor, etiqueta in estados %}
                            <option value="{{ valor }}" {% if request.GET.estado == valor %}selected{% endif %}>{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <a href="{% url 'lista_producto' %}" class="btn btn-outline-secondary w-100 text-uppercase">Limpiar Filtros</a>
                </div>
            </form>
        </div>
    </div>

    {% include 'producto/tabla_productos.html' %}
    
</div>
{% endblock %}
