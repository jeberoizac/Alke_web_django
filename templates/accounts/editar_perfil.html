{% extends "base.html" %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Editar mis datos</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <h5 class="text-muted border-bottom pb-2">Información Personal</h5>
                    {{ u_form.as_p }}

                    <h5 class="text-muted border-bottom pb-2 mt-4">Imagen y Contacto</h5>
                    {{ p_form.as_p }}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">GUARDAR CAMBIOS</button>
                        <a href="{% url 'perfil' %}" class="btn btn-outline-secondary">CANCELAR</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
