{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alke Solutions{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 text-uppercase">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">Alke Web</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav" >
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'index' %}">Inicio</a>
                <a class="nav-link" href="{% url 'lista_producto' %}">Productos</a>
                <a class="nav-link" href="{% url 'contacto' %}">Contacto</a>
            </div>
        </div>
    </div>
</nav>

    <main class="container">
        {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
        {% block content %}
        {% endblock %}
    </main>

    <!-- <footer class="fixed-bottom text-center mb-5 py-3 bg-light">
        <p>&copy; 2026 Alke Solutions </p>
    </footer> -->
   <footer class="text-center py-3 bg-light border-top mt-5">
    <p>&copy; 2026 Alke Solutions </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
